# Stub ops — preferí `npm run mail:dev` o compose en kai-suite/services/kai-mail.
# Descomentar/ajustar build path en el VPS cuando despliegues el sidecar 1×.
services:
  kai-mail:
    profiles: ["mail"]
    # build: ../../kai/services/kai-mail   # ajustar ruta al monorepo en el host
    image: kai-mail:local
    environment:
      PORT: "5040"
      REDIS_HOST: host.docker.internal
      REDIS_PORT: "6379"
      # SMTP_HOST / SMTP_PORT / MAIL_FROM / KAI_MAIL_API_KEY → secretos del host
    ports:
      - "5040:5040"
    restart: unless-stopped
