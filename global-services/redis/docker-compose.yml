# Redis compartido — una instancia por host
services:
  redis:
    image: redis:7-alpine
    container_name: kai-global-redis
    ports:
      - "6379:6379"
    volumes:
      - kai_global_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kai_global_redis_data:
